trigger:
  branches:
    include:
      - main

variables:
  acrName: 'jassacr'
  acrLoginServer: 'jassacr.azurecr.io'
  backendImage: 'jassacr.azurecr.io/jass-backend'
  frontendImage: 'jassacr.azurecr.io/jass-frontend'
  k8sNamespace: 'jass'

stages:

  # ── Stage 1 : Build ────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build Docker Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Frontend & Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 2 : Test & Sécurité ─────────────────────────────────────────────
  - stage: Test
    displayName: 'Test & Security Scan'
    dependsOn: Build
    jobs:
      - job: CodeQuality
        displayName: 'SonarQube Analysis'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: SonarQubePrepare@7
            displayName: 'Préparer analyse SonarQube'
            inputs:
              SonarQube: 'sonarqube-connection'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'ghofrane-benach_JASS---PFE'
              cliProjectName: 'JASS E-Commerce'
            continueOnError: true

          - task: SonarQubeAnalyze@7
            displayName: 'Lancer analyse SonarQube'
            continueOnError: true

          - task: SonarQubePublish@7
            displayName: 'Publier résultats SonarQube'
            inputs:
              pollingTimeoutSec: '300'
            continueOnError: true

      - job: SecurityScan
        displayName: 'Trivy Security Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              echo "=== Scan Backend Image ==="
              trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(backendImage):latest || true
              echo "=== Scan Frontend Image ==="
              trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(frontendImage):latest || true
            displayName: 'Scan images avec Trivy'

  # ── Stage 3 : Push ACR ────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push to ACR'
    dependsOn: Test
    jobs:
      - job: PushImages
        displayName: 'Push Images to Azure Container Registry'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build & Push Backend'
            inputs:
              command: buildAndPush
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build & Push Frontend'
            inputs:
              command: buildAndPush
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 4 : Deploy AKS Actif ────────────────────────────────────────────
  - stage: DeployActif
    displayName: 'Deploy to AKS Actif'
    dependsOn: Push
    jobs:
      - job: DeployActif
        displayName: 'Helm Deploy AKS Actif'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: KubectlInstaller@0
            displayName: 'Install kubectl'
            inputs:
              kubectlVersion: 'latest'

          - script: |
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            displayName: 'Install Helm'

          - task: Kubernetes@1
            displayName: 'Get AKS credentials & Helm deploy Actif'
            inputs:
              kubernetesServiceEndpoint: 'jass-aks-actif-jass-pipeline'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group jass-rg --name jass-aks-actif --overwrite-existing
                helm upgrade --install jass $(System.DefaultWorkingDirectory)/helm/jass-chart \
                  --namespace $(k8sNamespace) \
                  --create-namespace \
                  --set image.registry=$(acrLoginServer) \
                  --set image.tag=$(Build.BuildId) \
                  --wait --timeout 10m || true

  # ── Stage 5 : Deploy AKS Passif ───────────────────────────────────────────
  - stage: DeployPassif
    displayName: 'Deploy to AKS Passif'
    dependsOn: DeployActif
    jobs:
      - job: DeployPassif
        displayName: 'Helm Deploy AKS Passif'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: KubectlInstaller@0
            displayName: 'Install kubectl'
            inputs:
              kubectlVersion: 'latest'

          - script: |
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            displayName: 'Install Helm'

          - task: Kubernetes@1
            displayName: 'Get AKS credentials & Helm deploy Passif'
            inputs:
              kubernetesServiceEndpoint: 'jass-aks-actif-jass-pipeline'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group jass-rg --name jass-aks-pass --overwrite-existing
                helm upgrade --install jass $(System.DefaultWorkingDirectory)/helm/jass-chart \
                  --namespace $(k8sNamespace) \
                  --create-namespace \
                  --set image.registry=$(acrLoginServer) \
                  --set image.tag=$(Build.BuildId) \
                  --wait --timeout 10m || true

