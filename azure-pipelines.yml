trigger:
  branches:
    include:
      - main

variables:
  acrName: 'jassacr'
  acrLoginServer: 'jassacr.azurecr.io'
  backendImage: 'jassacr.azurecr.io/jass-backend'
  frontendImage: 'jassacr.azurecr.io/jass-frontend'
  k8sNamespace: 'jass'

stages:

  # ── Stage 1 : Build ────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build Docker Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Frontend & Backend'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 2 : Test & Sécurité ─────────────────────────────────────────────
  - stage: Test
    displayName: 'Test & Security Scan'
    dependsOn: Build
    jobs:
      - job: CodeQuality
        displayName: 'SonarQube Analysis'
        pool: Default
        steps:
          - task: SonarQubePrepare@8
            displayName: 'Préparer analyse SonarQube'
            inputs:
              SonarQube: 'sonarqube-connection'
              scannerMode: 'CLI'
              configMode: 'file'
              cliProjectKey: 'ghofrane-benach_JASS---PFE'
              cliProjectName: 'JASS E-Commerce'
              extraProperties: |
                sonar.organization=ghofranepfe2026
            continueOnError: true

          - task: SonarQubeAnalyze@8
            displayName: 'Lancer analyse SonarQube'
            continueOnError: true

          - task: SonarQubePublish@8
            displayName: 'Publier résultats SonarQube'
            inputs:
              pollingTimeoutSec: '300'
            continueOnError: true

      - job: SecurityScan
        displayName: 'Trivy Security Scan'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              echo "=== Scan Backend Image ==="
              trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(backendImage):latest || true
              echo "=== Scan Frontend Image ==="
              trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(frontendImage):latest || true
     
  # ── Stage 3 : Push ACR ────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push to ACR'
    dependsOn: Test
    jobs:
      - job: PushImages
        displayName: 'Push Images to Azure Container Registry'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Build & Push Backend'
            inputs:
              command: buildAndPush
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build & Push Frontend'
            inputs:
              command: buildAndPush
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 4 : Deploy AKS (manuel via Helm) ────────────────────────────────
  # NOTE: Le déploiement sur AKS est effectué via Ansible + Helm
  # en dehors du pipeline CI/CD (contrainte de permissions Azure AD).
  # Commande : ansible-playbook ansible/playbook.yml
  - stage: DeployInfo
    displayName: 'Deploy Info'
    dependsOn: Push
    jobs:
      - job: DeployInfo
        displayName: 'Deployment Instructions'
        pool: Default
        steps:
          - script: |
              echo "=============================================="
              echo "  Images pushées vers ACR avec succès ✅"
              echo "  Backend  : $(backendImage):$(Build.BuildId)"
              echo "  Frontend : $(frontendImage):$(Build.BuildId)"
              echo "=============================================="
              echo ""
              echo "  Deploy sur AKS via Ansible :"
              echo "  ansible-playbook ansible/playbook.yml"
              echo ""
              echo "  Ou directement via Helm :"
              echo "  helm upgrade --install jass ./helm/jass-chart"
              echo "    --namespace jass"
              echo "    --set image.tag=$(Build.BuildId)"
              echo "=============================================="
            displayName: 'Afficher les instructions de déploiement'

    -  stage: LoadTest
              displayName: 'K6 Load Testing'
               dependsOn: DeployActif
        jobs:
      -  job: K6Test
         pool: Default
         steps:
         - script: |
            docker run --rm \
              -e BASE_URL=http://$(NGINX_IP) \
              grafana/k6 run k6/smoke-test.js
           displayName: 'K6 Smoke Test'      displayName: 'Scan images avec Trivy'

