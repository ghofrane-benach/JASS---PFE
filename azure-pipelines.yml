trigger:
  branches:
    include:
      - main

variables:
  acrName: 'jassacr'
  acrLoginServer: 'jassacr.azurecr.io'
  backendImage: 'jassacr.azurecr.io/jass-backend'
  frontendImage: 'jassacr.azurecr.io/jass-frontend'
  k8sNamespace: 'jass'

stages:

  # ── Stage 1 : Build ───────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build Docker Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Frontend & Backend'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 2 : Test & Sécurité ────────────────────────────────────────────
  - stage: Test
    displayName: 'Test & Security Scan'
    dependsOn: Build
    jobs:
      - job: CodeQuality
        displayName: 'SonarQube Analysis'
        pool: Default
        condition: false
        variables:
          JAVA_HOME: 'D:\Java\jdk-17'
        steps:
          - task: SonarQubePrepare@8
            displayName: 'Préparer analyse SonarQube'
            inputs:
              SonarQube: 'sonarqube-connection'
              scannerMode: 'CLI'
              configMode: 'file'
            continueOnError: true

          - task: SonarQubeAnalyze@8
            displayName: 'Lancer analyse SonarQube'
            continueOnError: true

          - task: SonarQubePublish@8
            displayName: 'Publier résultats SonarQube'
            inputs:
              pollingTimeoutSec: '300'
            continueOnError: true

      - job: SecurityScan
        displayName: 'Trivy Security Scan'
        pool: Default
        steps:
          - powershell: |
              Write-Host "=== Trivy Security Scan - Backend ==="
              docker run --rm `
                -v "$(System.DefaultWorkingDirectory)/backend:/app" `
                aquasec/trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress /app
              Write-Host "=== Trivy Security Scan - Frontend ==="
              docker run --rm `
                -v "$(System.DefaultWorkingDirectory)/frontend:/app" `
                aquasec/trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress /app
              Write-Host "=== Trivy scan completed ==="
            displayName: 'Scan code source avec Trivy'
            continueOnError: true

  # ── Stage 3 : Push ACR ───────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push to ACR'
    dependsOn: Test
    jobs:
      - job: PushImages
        displayName: 'Push Images to Azure Container Registry'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Build & Push Backend'
            inputs:
              command: buildAndPush
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build & Push Frontend'
            inputs:
              command: buildAndPush
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 4 : Deploy AKS Actif ────────────────────────────────────────────
  - stage: DeployActif
    displayName: 'Deploy to AKS Actif'
    dependsOn: Push
    jobs:
      - job: DeployActif
        displayName: 'Helm Deploy AKS Actif'
        pool: Default
        steps:
          - powershell: |
              Write-Host "=== Connexion au cluster Actif ==="
              az aks get-credentials --resource-group jass-rg --name jass-aks-actif --overwrite-existing
              Write-Host "=== Helm upgrade JASS Actif ==="
              helm upgrade --install jass "$(System.DefaultWorkingDirectory)/helm/jass-chart" `
                --namespace jass `
                --create-namespace `
                --set backend.image.tag=$(Build.BuildId) `
                --set frontend.image.tag=$(Build.BuildId) `
                --wait --timeout 5m
              Write-Host "=== Verification des pods ==="
              kubectl get pods -n jass
            displayName: 'Deploy sur AKS Actif'
            continueOnError: true

  # ── Stage 5 : Deploy AKS Passif ───────────────────────────────────────────
  - stage: DeployPassif
    displayName: 'Deploy to AKS Passif'
    dependsOn: DeployActif
    jobs:
      - job: DeployPassif
        displayName: 'Helm Deploy AKS Passif'
        pool: Default
        steps:
          - powershell: |
              Write-Host "=== Connexion au cluster Passif ==="
              az aks get-credentials --resource-group jass-rg --name jass-aks-pass --overwrite-existing
              Write-Host "=== Helm upgrade JASS Passif ==="
              helm upgrade --install jass "$(System.DefaultWorkingDirectory)/helm/jass-chart" `
                --namespace jass `
                --create-namespace `
                --set backend.image.tag=$(Build.BuildId) `
                --set frontend.image.tag=$(Build.BuildId) `
                --wait --timeout 5m
              Write-Host "=== Verification des pods ==="
              kubectl get pods -n jass
            displayName: 'Deploy sur AKS Passif'
            continueOnError: true

  # ── Stage 6 : K6 Load Test ────────────────────────────────────────────────
  - stage: LoadTest
    displayName: 'K6 Load Testing'
    dependsOn: DeployActif
    jobs:
      - job: K6Test
        displayName: 'K6 Smoke Test'
        pool: Default
        steps:
          - powershell: |
              Write-Host "=== K6 Smoke Test ==="
              Get-Content k6/smoke-test.js | docker run --rm -i `
                -e BASE_URL=http://host.docker.internal:3000 `
                grafana/k6 run -
              Write-Host "=== K6 Test completed ==="
            displayName: 'K6 Smoke Test'
            continueOnError: true