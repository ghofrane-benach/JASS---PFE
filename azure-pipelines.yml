trigger:
  branches:
    include:
      - main

variables:
  acrName: 'jassacr'
  acrLoginServer: 'jassacr.azurecr.io'
  backendImage: 'jassacr.azurecr.io/jass-backend'
  frontendImage: 'jassacr.azurecr.io/jass-frontend'
  k8sNamespace: 'jass'

stages:

  # ── Stage 1 : Build ───────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build Docker Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Frontend & Backend'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 2 : Test & Sécurité ────────────────────────────────────────────
  - stage: Test
    displayName: 'Test & Security Scan'
    dependsOn: Build
    jobs:
      - job: CodeQuality
        displayName: 'SonarQube Analysis'
        pool: Default
        steps:
          - task: SonarQubePrepare@8
            displayName: 'Préparer analyse SonarQube'
            inputs:
              SonarQube: 'sonarqube-connection'
              scannerMode: 'CLI'
              configMode: 'file'
            continueOnError: true

          - task: SonarQubeAnalyze@8
            displayName: 'Lancer analyse SonarQube'
            continueOnError: true

          - task: SonarQubePublish@8
            displayName: 'Publier résultats SonarQube'
            inputs:
              pollingTimeoutSec: '300'
            continueOnError: true

      - job: SecurityScan
        displayName: 'Trivy Security Scan'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - script: |
              docker run --rm aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(backendImage):latest || true
              docker run --rm aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $(frontendImage):latest || true
            displayName: 'Scan images avec Trivy'

  # ── Stage 3 : Push ACR ───────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push to ACR'
    dependsOn: Test
    jobs:
      - job: PushImages
        displayName: 'Push Images to Azure Container Registry'
        pool: Default
        steps:
          - task: Docker@2
            displayName: 'Build & Push Backend'
            inputs:
              command: buildAndPush
              dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              repository: '$(backendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build & Push Frontend'
            inputs:
              command: buildAndPush
              dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              repository: '$(frontendImage)'
              containerRegistry: 'acr-service-connection'
              tags: |
                $(Build.BuildId)
                latest

  # ── Stage 4 : Deploy Info ─────────────────────────────────────────────────
  - stage: DeployInfo
    displayName: 'Deploy Info'
    dependsOn: Push
    jobs:
      - job: DeployInfo
        displayName: 'Deployment Instructions'
        pool: Default
        steps:
          - script: |
              echo "=============================================="
              echo "  Images pushees vers ACR avec succes"
              echo "  Backend  : $(backendImage):$(Build.BuildId)"
              echo "  Frontend : $(frontendImage):$(Build.BuildId)"
              echo "=============================================="
              echo "  Deploy sur AKS via Ansible :"
              echo "  ansible-playbook ansible/playbook.yml"
              echo "=============================================="
            displayName: 'Afficher les instructions de deploiement'

  # ── Stage 5 : K6 Load Test ───────────────────────────────────────────────
  - stage: LoadTest
    displayName: 'K6 Load Testing'
    dependsOn: DeployInfo
    jobs:
      - job: K6Test
        displayName: 'K6 Smoke Test'
        pool: Default
        steps:
          - script: |
              docker run --rm -e BASE_URL=http://localhost:3000 grafana/k6 run - < k6/smoke-test.js || true
            displayName: 'K6 Smoke Test'